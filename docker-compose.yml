services:
  # Jupyter + TensorBoard
  notebook:
    build: .
    image: j4-rnn-lstm
    ports:
      - "8888:8888"   # Jupyter
      - "6006:6006"   # TensorBoard
    volumes:
      - ./:/tf/work                          # projet (persiste sur Windows)
      - keras_cache:/root/.keras             # cache datasets keras
      - hf_cache:/root/.cache/huggingface    # cache datasets HuggingFace
    working_dir: /tf/work
    command: bash -c "tensorboard --logdir /tf/work/logs --host 0.0.0.0 --port 6006 & jupyter notebook --notebook-dir=/tf/work --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=''"

  # WebApp Streamlit, a la demande : docker compose --profile webapp up
  webapp:
    build: .
    image: j4-rnn-lstm
    profiles: ["webapp"]
    ports:
      - "8501:8501"   # Streamlit
    volumes:
      - ./:/tf/work
      - keras_cache:/root/.keras
    working_dir: /tf/work
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true

volumes:
  keras_cache:
  hf_cache:
